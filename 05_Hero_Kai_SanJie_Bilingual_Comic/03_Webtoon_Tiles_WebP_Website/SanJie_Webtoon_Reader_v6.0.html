 "filename": "CH12_tile_019.webp", "drive_id": "1eDBfxZR9eCEDLmd9857Mix1_j1xdjh6X", "width": 800, "height": 1460}, {"tile_index": 20, "filename": "CH12_tile_020.webp", "drive_id": "1K2KGFDaNw_sXVLDZldZAfoo7w-Ay9pDR", "width": 800, "height": 1460}, {"tile_index": 21, "filename": "CH12_tile_021.webp", "drive_id": "19lCWz7-eZmCEtszA0OoCgEFQwMPw3gku", "width": 800, "height": 1460}]}]};
let manifest = MANIFEST_FALLBACK;
let langFilter = 'ALL';
let filtered = [];
let currentIdx = 0;

function driveImgUrl(id) {
  return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
}

function driveViewUrl(id) {
  return `https://drive.google.com/file/d/${id}/view?usp=drivesdk`;
}

function setLang(l) {
  langFilter = l;
  ['langAll','langEn','langZh'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById(l === 'ALL' ? 'langAll' : (l === 'EN' ? 'langEn' : 'langZh')).classList.add('active');
  rebuildSelect();
}

function rebuildSelect() {
  filtered = manifest.chapters.filter(c => langFilter === 'ALL' || (c.language || 'BILINGUAL') === langFilter);
  const sel = document.getElementById('chapterSelect');
  sel.innerHTML = '';
  filtered.forEach((c, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = `${c.chapter} — ${c.edition || ''} (${c.tile_count} tiles)`;
    sel.appendChild(opt);
  });
  currentIdx = 0;
  renderChapter();
}

function selectChapter(idx) {
  currentIdx = parseInt(idx, 10) || 0;
  renderChapter();
}

function stepChapter(delta) {
  const next = currentIdx + delta;
  if (next >= 0 && next < filtered.length) {
    currentIdx = next;
    document.getElementById('chapterSelect').value = currentIdx;
    renderChapter();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
}

function renderChapter() {
  const ch = filtered[currentIdx];
  if (!ch) return;
  document.getElementById('chTitle').textContent = `${ch.slug || ch.chapter} (${ch.edition || ''})`;
  document.getElementById('chSub').textContent = `${ch.tile_count} WebP tiles (800×1460px) · Language: ${ch.language || 'BILINGUAL'}`;
  const links = document.getElementById('chLinks');
  links.innerHTML = '';
  if (ch.pdf_drive_id) links.innerHTML += `<a class="btn primary" target="_blank" href="${driveViewUrl(ch.pdf_drive_id)}">PDF</a>`;
  if (ch.stitched_strip && ch.stitched_strip.drive_id) links.innerHTML += `<a class="btn" target="_blank" href="${driveViewUrl(ch.stitched_strip.drive_id)}">800px Strip (${ch.stitched_strip.size_mb} MB)</a>`;
  if (ch.tile_subfolder_drive_id) links.innerHTML += `<a class="btn" target="_blank" href="https://drive.google.com/drive/folders/${ch.tile_subfolder_drive_id}">Tiles Folder</a>`;

  const stack = document.getElementById('readerStack');
  stack.innerHTML = '';
  (ch.tiles || []).forEach(t => {
    const wrap = document.createElement('div');
    wrap.className = 'tile-wrap';
    wrap.innerHTML = `<img loading="lazy" src="${driveImgUrl(t.drive_id)}" alt="${t.filename}" /><div class="tile-cap"><span>Tile ${t.tile_index} / ${ch.tile_count}</span><span>${t.filename}</span></div>`;
    stack.appendChild(wrap);
  });
}

async function init() {
  try {
    const r = await fetch('./webtoon_manifest.json', {cache: 'no-store'});
    if (r.ok) manifest = await r.json();
  } catch (e) {}
  document.getElementById('manifestBadge').textContent = `${manifest.total_chapters} Chapters · ${manifest.total_tiles} Tiles`;
  document.getElementById('footerNote').textContent = `Synced to webtoon_manifest.json (${manifest.generated_at})`;
  rebuildSelect();
}
init();
</script>
